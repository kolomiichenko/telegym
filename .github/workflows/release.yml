name: Release

# Push a tag like v0.6.0 to draft a GitHub Release with prebuilt binaries
# (telegym-mock, telegym-proxy, k6 with xk6-telegym) and the telegym-mock
# image on GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            pkg/xk6/go.sum

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          name="telegym_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "build/$name" dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/" ./cmd/...
          cp README.md LICENSE "build/$name/"
          if [ "$GOOS" = windows ]; then
            (cd build && zip -qr "../dist/$name.zip" "$name")
          else
            tar -C build -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  k6:
    name: k6 + xk6-telegym (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            pkg/xk6/go.sum

      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          GOOS='' GOARCH='' go install go.k6.io/xk6/cmd/xk6@latest
          name="k6-telegym_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "build/$name" dist
          GOWORK=off xk6 build --output "build/$name/k6" \
            --with github.com/kolomiichenko/telegym/pkg/xk6=./pkg/xk6 \
            --replace github.com/kolomiichenko/telegym="$PWD"
          tar -C build -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: k6-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, k6]
    permissions:
      contents: write
    steps:
      # Only our archives: docker/build-push-action uploads a build record
      # artifact too, which must not end up in the release.
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: k6-*
          path: dist
          merge-multiple: true

      # pkg/xk6 is its own Go module, versioned by pkg/xk6/vX.Y.Z tags, so
      # `xk6 build --with github.com/kolomiichenko/telegym/pkg/xk6@vX.Y.Z` works.
      # A tag already pushed by hand on the release commit is kept; one on
      # another commit fails the release.
      - name: Tag the xk6 module
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags/pkg/xk6/$TAG"
          if ! existing=$(gh api "$ref" --jq '[.object.type, .object.sha] | join(" ")' 2>/dev/null); then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/pkg/xk6/$TAG" -f "sha=$GITHUB_SHA"
            exit 0
          fi
          read -r type sha <<< "$existing"
          # An annotated tag points at a tag object; follow it to the commit.
          if [[ "$type" == tag ]]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')
          fi
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "::error::pkg/xk6/$TAG points at $sha, not the release commit $GITHUB_SHA"
            exit 1
          fi
          echo "pkg/xk6/$TAG already points at $GITHUB_SHA"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          # A draft, so the maintainer adds the title, summary and thanks to
          # contributors on top of the generated notes before publishing.
          # release-title.yml keeps the tag in front of the title.
          flags=(--draft --verify-tag --generate-notes)
          # v1.2.3-rc.1 and similar are pre-releases, never "Latest".
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" -- *

  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/telegym-mock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
